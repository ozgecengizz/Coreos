<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreOS - Gelişmiş Komuta Merkezi & Zihin Akışı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        cardHover: '#1a2640',
                        inputBg: '#0f172a',
                        accent: '#6366f1',
                        accentHover: '#4f46e5',
                        neonGreen: '#10b981',
                        neonAmber: '#f59e0b',
                        neonPurple: '#8b5cf6',
                        neonRed: '#ef4444',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col font-sans selection:bg-accent selection:text-white transition-colors duration-300" id="bodyRoot">

    <!-- Üst Navigasyon -->
    <header class="bg-[#0f172a]/85 dark:bg-[#0f172a]/85 bg-white/85 backdrop-blur-md border-b border-gray-800 dark:border-gray-800 border-gray-200 sticky top-0 z-50 px-4 sm:px-6 py-3.5 transition-colors">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-accent to-indigo-400 flex items-center justify-center shadow-lg shadow-accent/20">
                    <i class="fa-solid fa-bolt text-white text-sm"></i>
                </div>
                <div>
                    <h1 id="appTitleDisplay" class="font-bold text-base tracking-tight text-gray-900 dark:text-white flex items-center gap-2">
                        CoreOS <span class="text-[10px] bg-accent/20 text-accent font-medium px-2 py-0.5 rounded-full border border-accent/30" id="headerProfileBadge">PRO</span>
                    </h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1">
                        <span id="currentDateString">Bugün</span> 
                        <span class="text-[10px] bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 px-1.5 py-0.2 rounded hidden sm:inline">Kısayol: Ctrl+K</span>
                    </p>
                </div>
            </div>

            <!-- Sağ: Görünüm Seçenekleri, Pomodoro & Ayarlar -->
            <div class="flex items-center gap-2">
                <div id="pomodoroWidget" onclick="togglePomodoroModal()" class="hidden sm:flex items-center gap-2 bg-gray-100 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 px-3 py-1.5 rounded-xl text-xs cursor-pointer hover:border-accent transition-all text-gray-700 dark:text-gray-300">
                    <i class="fa-solid fa-stopwatch text-accent animate-pulse"></i>
                    <span id="pomodoroDisplay" class="font-mono font-bold">25:00</span>
                </div>

                <div class="hidden md:flex items-center bg-gray-100 dark:bg-inputBg p-1 rounded-xl border border-gray-200 dark:border-gray-800 text-xs gap-1">
                    <button onclick="switchMainView('stream')" id="nav-stream" class="px-3 py-1.5 rounded-lg bg-accent text-white font-medium transition-all cursor-pointer shadow-sm">Akış</button>
                    <button onclick="switchMainView('kanban')" id="nav-kanban" class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all cursor-pointer flex items-center gap-1"><i class="fa-solid fa-columns text-accent"></i> Pano</button>
                    <button onclick="switchMainView('pool')" id="nav-pool" class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all cursor-pointer flex items-center gap-1"><i class="fa-solid fa-water text-neonAmber"></i> Havuz</button>
                    <button onclick="switchMainView('calendar')" id="nav-calendar" class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all cursor-pointer flex items-center gap-1"><i class="fa-solid fa-calendar-days text-accent"></i> Takvim</button>
                </div>
                
                <button onclick="toggleTheme()" class="bg-gray-100 dark:bg-inputBg hover:bg-gray-200 dark:hover:bg-gray-800 border border-gray-200 dark:border-gray-800 text-gray-700 dark:text-gray-300 w-9 h-9 rounded-xl flex items-center justify-center transition-all cursor-pointer text-xs" title="Tema Değiştir">
                    <i id="themeIcon" class="fa-solid fa-moon text-accent"></i>
                </button>

                <button onclick="openSettingsModal()" class="bg-gray-100 dark:bg-inputBg hover:bg-gray-200 dark:hover:bg-gray-800 border border-gray-200 dark:border-gray-800 text-gray-700 dark:text-gray-300 px-3 py-2 rounded-xl text-xs flex items-center gap-2 transition-all cursor-pointer">
                    <i class="fa-solid fa-sliders text-accent"></i>
                    <span class="hidden sm:inline" id="profileNameBtn">Ayarlar</span>
                </button>
            </div>
        </div>

        <!-- Mobil Görünüm Sekme Barı -->
        <div class="grid grid-cols-4 md:hidden bg-gray-100 dark:bg-inputBg p-1 rounded-xl border border-gray-200 dark:border-gray-800 text-[10px] gap-0.5 mt-3 text-center font-medium">
            <button onclick="switchMainView('stream')" id="nav-stream-m" class="py-1.5 rounded-lg bg-accent text-white">Akış</button>
            <button onclick="switchMainView('kanban')" id="nav-kanban-m" class="py-1.5 rounded-lg text-gray-600 dark:text-gray-400">Pano</button>
            <button onclick="switchMainView('pool')" id="nav-pool-m" class="py-1.5 rounded-lg text-gray-600 dark:text-gray-400">Havuz</button>
            <button onclick="switchMainView('calendar')" id="nav-calendar-m" class="py-1.5 rounded-lg text-gray-600 dark:text-gray-400">Takvim</button>
        </div>
    </header>

    <!-- Ana İçerik Ekranı -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">
        
        <!-- Enerji/Mod Çubuğu ve İstatistik Kartları -->
        <section id="statsSection" class="flex flex-col gap-3">
            <div class="bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800/80 rounded-2xl px-4 py-2.5 flex items-center justify-between shadow-sm">
                <span class="text-xs text-gray-400 font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-bolt text-accent"></i> Günlük Mod / Enerji:
                </span>
                <div class="flex items-center gap-4">
                    <button onclick="setMood('🔥')" id="mood-btn-🔥" class="text-sm transition-all cursor-pointer hover:scale-125">🔥</button>
                    <button onclick="setMood('⚡')" id="mood-btn-⚡" class="text-sm transition-all cursor-pointer hover:scale-125">⚡</button>
                    <button onclick="setMood('💡')" id="mood-btn-💡" class="text-sm transition-all cursor-pointer hover:scale-125">💡</button>
                    <button onclick="setMood('☕')" id="mood-btn-☕" class="text-sm transition-all cursor-pointer hover:scale-125">☕</button>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div onclick="setFilter('all')" class="bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800/80 hover:border-accent/60 rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden shadow-sm cursor-pointer transition-all group">
                    <div class="w-12 h-12 rounded-xl bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-lg group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-fire-flame-curved"></i>
                    </div>
                    <div>
                        <span class="text-xs text-gray-500 dark:text-gray-400 font-medium">Günlük Başarı</span>
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white" id="completionRate">%0 Tamamlandı</h2>
                    </div>
                </div>

                <div onclick="setFilter('task')" class="bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800/80 hover:border-neonGreen/60 rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden shadow-sm cursor-pointer transition-all group">
                    <div class="w-12 h-12 rounded-xl bg-neonGreen/10 border border-neonGreen/20 flex items-center justify-center text-neonGreen text-lg group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-check-double"></i>
                    </div>
                    <div>
                        <span class="text-xs text-gray-500 dark:text-gray-400 font-medium">Aktif Görevler</span>
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white" id="activeTaskCount">0 Görev</h2>
                    </div>
                </div>

                <div onclick="setFilter('idea')" class="bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800/80 hover:border-neonAmber/60 rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden shadow-sm cursor-pointer transition-all group">
                    <div class="w-12 h-12 rounded-xl bg-neonAmber/10 border border-neonAmber/20 flex items-center justify-center text-neonAmber text-lg group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-lightbulb"></i>
                    </div>
                    <div>
                        <span class="text-xs text-gray-500 dark:text-gray-400 font-medium">Notlar</span>
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white" id="ideaCount">0 Not</h2>
                    </div>
                </div>
            </div>
        </section>

        <!-- Hızlı Girdi Çekmecesi -->
        <section id="captureSection" class="bg-white dark:bg-cardBg border border-accent/40 shadow-lg shadow-accent/10 rounded-2xl p-3 sm:p-4 flex flex-col gap-3 relative transition-all">
            <div class="flex items-center justify-between bg-gray-50 dark:bg-inputBg/80 px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-800 text-xs">
                <button onclick="changeStreamDate(-1)" class="w-8 h-8 rounded-lg bg-white dark:bg-cardBg hover:bg-gray-100 dark:hover:bg-cardHover border border-gray-200 dark:border-gray-700 text-accent flex items-center justify-center transition-all cursor-pointer shadow-sm">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <div class="flex items-center gap-2 font-semibold text-gray-800 dark:text-gray-200">
                    <i class="fa-solid fa-calendar-day text-accent"></i>
                    <span id="activeDateLabel">Bugün</span>
                    <button id="todayResetBtn" onclick="resetToToday()" class="hidden text-[10px] bg-accent/20 text-accent px-2 py-0.5 rounded-md hover:bg-accent hover:text-white transition-all cursor-pointer">Bugüne Dön</button>
                </div>
                <button onclick="changeStreamDate(1)" class="w-8 h-8 rounded-lg bg-white dark:bg-cardBg hover:bg-gray-100 dark:hover:bg-cardHover border border-gray-200 dark:border-gray-700 text-accent flex items-center justify-center transition-all cursor-pointer shadow-sm">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>

            <div class="flex items-center gap-3">
                <div class="text-accent pl-2">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <input type="text" id="streamInput" autofocus
                    class="flex-1 bg-transparent border-none outline-none text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 text-base"
                    placeholder="Beyin Boşaltma (Brain Dump): Aklındakileri yaz, #etiket ekle ve Enter'a bas..."
                    onkeydown="handleKeyDown(event)">
            </div>
            
            <div class="flex flex-wrap items-center justify-between pt-2 border-t border-gray-100 dark:border-gray-800/60 gap-2 text-xs">
                <div class="flex items-center gap-2 text-gray-500 dark:text-gray-400">
                    <span class="text-[11px]"><i class="fa-solid fa-bolt mr-1 text-accent"></i> <b>Ctrl + K</b> ile hızlı erişim.</span>
                </div>
                <div class="flex items-center gap-2">
                    <input type="date" id="streamDateInput" class="bg-gray-50 dark:bg-inputBg text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-800 rounded-xl px-2.5 py-1.5 outline-none text-xs font-medium cursor-pointer" title="Tarih seçin (Boş bırakılırsa Havuz'a gider)">
                    <input type="time" id="streamTime" value="09:00" class="bg-gray-50 dark:bg-inputBg text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-800 rounded-xl px-2.5 py-1.5 outline-none text-xs font-medium cursor-pointer">
                    
                    <select id="streamType" class="bg-gray-50 dark:bg-inputBg text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-800 rounded-xl px-3 py-1.5 outline-none text-xs font-medium cursor-pointer">
                        <option value="idea">💡 Not</option>
                        <option value="task">✅ Görev</option>
                        <option value="goal">🎯 Hedef</option>
                        <option value="reminder">⏰ Hatırlatıcı</option>
                        <option value="event">🤝 Randevu/Etkinlik</option>
                    </select>
                    <button onclick="addStreamItem()" 
                        class="bg-accent hover:bg-accentHover text-white px-4 py-1.5 rounded-xl transition-all font-semibold flex items-center gap-1.5 shadow-md shadow-accent/20 cursor-pointer">
                        <span>Kaydet</span>
                        <i class="fa-solid fa-arrow-up-right text-[10px]"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Dynamic Tag Cloud -->
        <section id="tagCloudSection" class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
            <span class="text-gray-400 font-medium shrink-0"><i class="fa-solid fa-tags text-accent mr-1"></i> Etiketler:</span>
            <div id="tagCloudContainer" class="flex items-center gap-1.5"></div>
        </section>

        <!-- Filtre Sekmeleri -->
        <section id="filterSection" class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-gray-200 dark:border-gray-800 pb-3 gap-3">
            <div class="flex gap-2 overflow-x-auto text-xs font-medium w-full sm:w-auto">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3.5 py-2 rounded-xl bg-accent text-white transition-all shadow-sm cursor-pointer whitespace-nowrap">Tümü</button>
                <button onclick="setFilter('idea')" id="filter-idea" class="filter-btn px-3.5 py-2 rounded-xl bg-white dark:bg-cardBg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all cursor-pointer whitespace-nowrap">Notlar</button>
                <button onclick="setFilter('task')" id="filter-task" class="filter-btn px-3.5 py-2 rounded-xl bg-white dark:bg-cardBg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all cursor-pointer whitespace-nowrap">Görevler</button>
                <button onclick="setFilter('goal')" id="filter-goal" class="filter-btn px-3.5 py-2 rounded-xl bg-white dark:bg-cardBg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all cursor-pointer whitespace-nowrap">Hedefler</button>
                <button onclick="setFilter('reminder')" id="filter-reminder" class="filter-btn px-3.5 py-2 rounded-xl bg-white dark:bg-cardBg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all cursor-pointer whitespace-nowrap">Hatırlatıcılar</button>
                <button onclick="setFilter('event')" id="filter-event" class="filter-btn px-3.5 py-2 rounded-xl bg-white dark:bg-cardBg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all cursor-pointer whitespace-nowrap">Randevular</button>
            </div>
            
            <div class="flex items-center gap-2 text-xs">
                <div class="bg-gray-50 dark:bg-inputBg border border-gray-200 dark:border-gray-800 rounded-xl px-3 py-1.5 flex items-center gap-2 text-gray-700 dark:text-gray-300 shadow-sm">
                    <span class="flex items-center gap-1 text-neonGreen font-semibold"><i class="fa-solid fa-circle-check text-[10px]"></i> <span id="badgeCompletedCount">0</span> Bitti</span>
                    <span class="text-gray-300 dark:text-gray-600">|</span>
                    <span class="flex items-center gap-1 text-neonRed font-semibold"><i class="fa-solid fa-ban text-[10px]"></i> <span id="badgeAbandonedCount">0</span> Vazgeçilen</span>
                </div>
                <button onclick="clearCompleted()" class="text-gray-500 dark:text-gray-400 hover:text-red-500 transition-colors p-2 rounded-xl bg-gray-50 dark:bg-inputBg border border-gray-200 dark:border-gray-800 cursor-pointer shadow-sm" title="Tamamlananları Temizle">
                    <i class="fa-solid fa-broom text-xs"></i>
                </button>
            </div>
        </section>

        <!-- Ana Konteyner -->
        <div id="mainContainer" class="flex flex-col gap-3 pb-12"></div>

    </main>

    <!-- Pomodoro Sayaç Modalı -->
    <div id="pomodoroModal" class="fixed inset-0 bg-darkBg/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl flex flex-col items-center gap-5 text-center">
            <h3 class="font-bold text-gray-900 dark:text-white text-base flex items-center gap-2">
                <i class="fa-solid fa-stopwatch text-accent"></i> Pomodoro Odak Modu
            </h3>
            <div class="flex items-center gap-2 text-xs">
                <label class="text-gray-500">Süre (Dakika):</label>
                <input type="number" id="pomoCustomMinutes" value="25" min="1" max="120" onchange="updatePomoCustomTime(this.value)" class="w-16 bg-gray-50 dark:bg-inputBg border border-gray-200 dark:border-gray-800 rounded-xl px-2 py-1 text-center font-bold text-accent outline-none">
            </div>
            <div id="modalTimerDisplay" class="text-5xl font-mono font-bold text-accent tracking-wider py-2">25:00</div>
            <div class="flex items-center justify-center gap-3 w-full">
                <button id="pomoStartBtn" onclick="startPomodoro()" class="bg-neonGreen hover:bg-neonGreen/80 text-darkBg font-bold px-5 py-2 rounded-xl text-xs transition-all cursor-pointer">Başlat</button>
                <button onclick="resetPomodoro()" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 px-4 py-2 rounded-xl text-xs transition-all cursor-pointer">Sıfırla</button>
                <button onclick="togglePomodoroModal()" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 px-4 py-2 rounded-xl text-xs transition-all cursor-pointer">Kapat</button>
            </div>
        </div>
    </div>

    <!-- Takvim Gün Detayı & Ekleme Modalı -->
    <div id="calendarDayModal" class="fixed inset-0 bg-darkBg/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex items-center justify-between pb-3 border-b border-gray-200 dark:border-gray-800">
                <h3 id="calendarModalDateTitle" class="font-bold text-gray-900 dark:text-white text-base">Gün Detayları</h3>
                <button onclick="closeCalendarDayModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <!-- Hızlı Ekleme Alanı Modalı -->
            <div class="flex items-center gap-2 bg-gray-50 dark:bg-inputBg p-2 rounded-xl border border-gray-200 dark:border-gray-800">
                <input type="text" id="calendarQuickInput" placeholder="Bu güne hızlı öğe ekle..." class="flex-1 bg-transparent border-none outline-none text-xs text-gray-900 dark:text-gray-100">
                <select id="calendarQuickType" class="bg-white dark:bg-cardBg text-xs border border-gray-200 dark:border-gray-700 rounded-lg px-2 py-1 outline-none">
                    <option value="task">Görev</option>
                    <option value="idea">Not</option>
                    <option value="event">Randevu</option>
                </select>
                <button onclick="addCalendarQuickItem()" class="bg-accent text-white text-xs px-3 py-1 rounded-lg font-bold">Ekle</button>
            </div>

            <div id="calendarModalItemsList" class="flex flex-col gap-2.5 max-h-[40vh] overflow-y-auto"></div>
            
            <div class="flex items-center justify-between pt-3 border-t border-gray-200 dark:border-gray-800 text-xs">
                <button onclick="jumpToStreamDateFromModal()" class="bg-accent/20 hover:bg-accent text-accent hover:text-white px-3.5 py-2 rounded-xl transition-all font-medium cursor-pointer">Bu Güne Git & Ekle</button>
                <button onclick="closeCalendarDayModal()" class="px-4 py-2 rounded-xl bg-gray-100 dark:bg-inputBg text-gray-700 dark:text-gray-300 transition-all cursor-pointer">Kapat</button>
            </div>
        </div>
    </div>

    <!-- Ayarlar Modalı -->
    <div id="settingsModal" class="fixed inset-0 bg-darkBg/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl flex flex-col gap-5 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-gray-200 dark:border-gray-800">
                <h3 class="font-bold text-gray-900 dark:text-white text-base flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-accent"></i> CoreOS Sistem Ayarları
                </h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="flex flex-col gap-4 text-xs">
                <div class="grid grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-gray-700 dark:text-gray-300 font-semibold">Profil / Sistem Adı</label>
                        <input type="text" id="settingsAppName" class="bg-gray-50 dark:bg-inputBg border border-gray-200 dark:border-gray-800 rounded-xl px-3 py-2.5 text-gray-900 dark:text-gray-200 outline-none focus:border-accent text-xs">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-gray-700 dark:text-gray-300 font-semibold">Rozet / Unvan</label>
                        <input type="text" id="settingsAppBadge" class="bg-gray-50 dark:bg-inputBg border border-gray-200 dark:border-gray-800 rounded-xl px-3 py-2.5 text-gray-900 dark:text-gray-200 outline-none focus:border-accent text-xs">
                    </div>
                </div>
                <div class="bg-gray-50 dark:bg-inputBg/50 border border-gray-200 dark:border-gray-800 rounded-xl p-4 flex flex-col gap-3">
                    <h4 class="font-bold text-gray-800 dark:text-gray-200 flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-accent"></i> JSON Yedekleme</h4>
                    <div class="flex flex-wrap gap-2 pt-1">
                        <button onclick="exportData()" class="bg-white dark:bg-cardBg hover:bg-gray-100 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 px-3 py-2 rounded-xl font-medium transition-all cursor-pointer flex items-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-download text-accent"></i> JSON İndir
                        </button>
                        <label class="bg-white dark:bg-cardBg hover:bg-gray-100 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 px-3 py-2 rounded-xl font-medium transition-all cursor-pointer flex items-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-upload text-neonGreen"></i> JSON Yükle
                            <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                        </label>
                    </div>
                </div>
                <div class="pt-2 border-t border-gray-200 dark:border-gray-800 flex items-center justify-between">
                    <span class="text-gray-700 dark:text-gray-300 font-semibold">Sistemi Sıfırla</span>
                    <button onclick="resetData()" class="bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/30 px-3 py-1.5 rounded-xl transition-all cursor-pointer font-medium">Sıfırla</button>
                </div>
            </div>
            <div class="flex items-center justify-end gap-2 pt-3 border-t border-gray-200 dark:border-gray-800">
                <button onclick="saveSettingsModal()" class="px-5 py-2.5 rounded-xl bg-accent hover:bg-accentHover text-white font-bold transition-all cursor-pointer text-xs shadow-md">Kaydet ve Kapat</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Komuta Motoru -->
    <script>
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDateString').innerText = new Date().toLocaleDateString('tr-TR', options);

        let userProfile = JSON.parse(localStorage.getItem('nexus_user_profile')) || { name: 'CoreOS', badge: 'PRO', mood: '⚡' };
        let currentTheme = localStorage.getItem('nexus_theme') || 'dark';

        let items = JSON.parse(localStorage.getItem('nexus_items')) || [];
        let currentFilter = 'all';
        let currentView = 'stream';
        let activeDate = new Date().toISOString().split('T')[0];
        let pomodoroInterval = null;
        let pomodoroTime = 25 * 60;
        let pomodoroRunning = false;

        document.addEventListener('DOMContentLoaded', () => {
            updateThemeUI();
            applyUserProfile();
            document.getElementById('streamDateInput').value = activeDate;
            updateDateLabel();
            render();
            
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    document.getElementById('streamInput').focus();
                }
            });
        });

        function applyUserProfile() {
            document.getElementById('appTitleDisplay').childNodes[0].nodeValue = userProfile.name + ' ';
            document.getElementById('headerProfileBadge').innerText = userProfile.badge;
            document.getElementById('profileNameBtn').innerText = userProfile.name;
            setMood(userProfile.mood, false);
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('nexus_theme', currentTheme);
            updateThemeUI();
        }

        function updateThemeUI() {
            const root = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (currentTheme === 'dark') {
                root.classList.add('dark');
                icon.className = 'fa-solid fa-moon text-accent';
            } else {
                root.classList.remove('dark');
                icon.className = 'fa-solid fa-sun text-neonAmber';
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter') addStreamItem();
        }

        function addStreamItem() {
            const input = document.getElementById('streamInput');
            const text = input.value.trim();
            if (!text) return;

            const type = document.getElementById('streamType').value;
            const time = document.getElementById('streamTime').value;
            const selectedDate = document.getElementById('streamDateInput').value;

            const tags = (text.match(/#[\wĞÜŞİÖÇğüşiöç]+/g) || []).map(t => t.replace('#', ''));

            const newItem = {
                id: Date.now().toString(),
                content: text,
                type: type,
                status: 'active',
                date: selectedDate || null,
                time: time,
                tags: tags,
                createdAt: new Date().toISOString()
            };

            items.unshift(newItem);
            saveAndRender();
            input.value = '';
        }

        function saveAndRender() {
            localStorage.setItem('nexus_items', JSON.stringify(items));
            render();
        }

        function switchMainView(view) {
            currentView = view;
            ['stream', 'kanban', 'pool', 'calendar'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                const btnM = document.getElementById(`nav-${v}-m`);
                if (btn) btn.className = v === view ? 'px-3 py-1.5 rounded-lg bg-accent text-white font-medium transition-all shadow-sm' : 'px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-400 hover:text-white transition-all cursor-pointer';
                if (btnM) btnM.className = v === view ? 'py-1.5 rounded-lg bg-accent text-white' : 'py-1.5 rounded-lg text-gray-600 dark:text-gray-400';
            });
            render();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn px-3.5 py-2 rounded-xl bg-white dark:bg-cardBg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all cursor-pointer whitespace-nowrap';
            });
            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) activeBtn.className = 'filter-btn px-3.5 py-2 rounded-xl bg-accent text-white transition-all shadow-sm cursor-pointer whitespace-nowrap';
            render();
        }

        function render() {
            updateStats();
            renderTagCloud();
            const container = document.getElementById('mainContainer');
            container.innerHTML = '';

            if (currentView === 'stream') renderStreamView(container);
            else if (currentView === 'kanban') renderKanbanView(container);
            else if (currentView === 'pool') renderPoolView(container);
            else if (currentView === 'calendar') renderCalendarView(container);
        }

        function renderStreamView(container) {
            const filtered = getFilteredItems().filter(i => i.date === activeDate);
            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-500 text-xs">Bu tarih için kayıt bulunamadı.</div>`;
                return;
            }
            filtered.forEach(item => container.appendChild(createItemCard(item)));
        }

        function renderKanbanView(container) {
            const kanbanWrapper = document.createElement('div');
            kanbanWrapper.className = 'grid grid-cols-1 md:grid-cols-3 gap-4';

            const statuses = [
                { id: 'active', title: 'Yapılacaklar', color: 'border-accent' },
                { id: 'completed', title: 'Tamamlananlar', color: 'border-neonGreen' },
                { id: 'abandoned', title: 'Er ertelenen / İptal', color: 'border-neonRed' }
            ];

            statuses.forEach(status => {
                const col = document.createElement('div');
                col.className = `bg-white dark:bg-cardBg border-t-4 ${status.color} border-x border-b border-gray-200 dark:border-gray-800 rounded-2xl p-4 flex flex-col gap-3 min-h-[300px]`;
                col.innerHTML = `<h3 class="font-bold text-sm text-gray-800 dark:text-gray-200 border-b border-gray-100 dark:border-gray-800 pb-2">${status.title}</h3>`;
                
                const colItems = getFilteredItems().filter(i => i.status === status.id);
                colItems.forEach(item => col.appendChild(createItemCard(item)));
                
                kanbanWrapper.appendChild(col);
            });

            container.appendChild(kanbanWrapper);
        }

        function renderPoolView(container) {
            const poolItems = getFilteredItems().filter(i => !i.date);
            if (poolItems.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-500 text-xs">Tarihsiz havuzda hiçbir öge bulunmuyor.</div>`;
                return;
            }
            poolItems.forEach(item => container.appendChild(createItemCard(item)));
        }

        function renderCalendarView(container) {
            const calendarWrapper = document.createElement('div');
            calendarWrapper.className = 'bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800 rounded-2xl p-4 sm:p-6 shadow-sm flex flex-col gap-4';

            const now = new Date(activeDate);
            const year = now.getFullYear();
            const month = now.getMonth();

            const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = new Date(year, month, 1).getDay();
            const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            calendarWrapper.innerHTML = `
                <div class="flex items-center justify-between pb-3 border-b border-gray-200 dark:border-gray-800">
                    <h2 class="font-bold text-base text-gray-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-accent"></i> ${monthNames[month]} ${year}
                    </h2>
                    <div class="flex gap-1 text-xs">
                        <button onclick="changeCalendarMonth(-1)" class="px-2.5 py-1.5 rounded-lg bg-gray-100 dark:bg-inputBg hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 transition-all cursor-pointer"><i class="fa-solid fa-chevron-left"></i> Önceki</button>
                        <button onclick="changeCalendarMonth(1)" class="px-2.5 py-1.5 rounded-lg bg-gray-100 dark:bg-inputBg hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 transition-all cursor-pointer">Sonraki <i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center font-bold text-[11px] text-gray-400 py-1">
                    <span>Pzt</span><span>Sal</span><span>Çar</span><span>Per</span><span>Cum</span><span>Cmt</span><span>Paz</span>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-1.5"></div>
            `;

            container.appendChild(calendarWrapper);
            const grid = document.getElementById('calendarGrid');

            for (let i = 0; i < adjustedFirstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'h-20 sm:h-24 rounded-xl bg-gray-50/50 dark:bg-inputBg/20 border border-transparent';
                grid.appendChild(emptyCell);
            }

            const todayStr = new Date().toISOString().split('T')[0];
            for (let day = 1; day <= daysInMonth; day++) {
                const dayString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayItems = items.filter(i => i.date === dayString);
                const isToday = dayString === todayStr;

                const cell = document.createElement('div');
                cell.onclick = () => openCalendarDayModal(dayString);
                cell.className = `h-20 sm:h-24 p-1.5 rounded-xl border transition-all cursor-pointer flex flex-col justify-between overflow-hidden ${
                    isToday 
                        ? 'border-accent bg-accent/5 font-bold' 
                        : 'border-gray-200 dark:border-gray-800 bg-white dark:bg-cardBg hover:border-accent/50'
                }`;

                let badgeHTML = '';
                if (dayItems.length > 0) {
                    const taskCount = dayItems.filter(i => i.type === 'task').length;
                    const ideaCount = dayItems.filter(i => i.type === 'idea').length;
                    badgeHTML = `
                        <div class="flex flex-col gap-0.5 text-[9px]">
                            ${taskCount ? `<span class="bg-accent/20 text-accent px-1 rounded truncate">✓ ${taskCount} Görev</span>` : ''}
                            ${ideaCount ? `<span class="bg-neonAmber/20 text-neonAmber px-1 rounded truncate">💡 ${ideaCount} Not</span>` : ''}
                            ${(dayItems.length - taskCount - ideaCount) > 0 ? `<span class="bg-gray-200 dark:bg-gray-800 text-gray-500 px-1 rounded truncate">+${dayItems.length - taskCount - ideaCount} Diğer</span>` : ''}
                        </div>
                    `;
                }

                cell.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="${isToday ? 'w-5 h-5 rounded-full bg-accent text-white flex items-center justify-center text-[10px]' : 'text-gray-700 dark:text-gray-300'}">${day}</span>
                        ${dayItems.length ? `<span class="w-1.5 h-1.5 rounded-full bg-accent"></span>` : ''}
                    </div>
                    ${badgeHTML}
                `;
                grid.appendChild(cell);
            }
        }

        function createItemCard(item) {
            const card = document.createElement('div');
            card.className = `bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800 rounded-2xl p-4 flex items-center justify-between gap-4 shadow-sm transition-all hover:border-accent/40 ${item.status === 'completed' ? 'opacity-50 line-through' : ''}`;
            
            const typeIcons = { idea: '💡', task: '✅', goal: '🎯', reminder: '⏰', event: '🤝' };
            
            card.innerHTML = `
                <div class="flex items-center gap-3">
                    <button onclick="toggleItemStatus('${item.id}')" class="w-6 h-6 rounded-lg border border-gray-300 dark:border-gray-700 flex items-center justify-center text-xs cursor-pointer">
                        ${item.status === 'completed' ? '<i class="fa-solid fa-check text-neonGreen"></i>' : ''}
                    </button>
                    <div>
                        <div class="text-xs font-medium text-gray-900 dark:text-gray-100 flex items-center gap-2">
                            <span>${typeIcons[item.type] || '📌'}</span>
                            <span>${item.content}</span>
                        </div>
                        <div class="text-[10px] text-gray-400 flex items-center gap-2 mt-1">
                            ${item.time ? `<span><i class="fa-regular fa-clock"></i> ${item.time}</span>` : ''}
                            ${item.tags.map(t => `<span class="text-accent">#${t}</span>`).join(' ')}
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="deleteItem('${item.id}')" class="text-gray-400 hover:text-neonRed p-1 text-xs cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            return card;
        }

        function toggleItemStatus(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.status = item.status === 'completed' ? 'active' : 'completed';
                saveAndRender();
            }
        }

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            saveAndRender();
        }

        function clearCompleted() {
            items = items.filter(i => i.status !== 'completed');
            saveAndRender();
        }

        function getFilteredItems() {
            return items.filter(i => currentFilter === 'all' || i.type === currentFilter);
        }

        function updateStats() {
            const total = items.length;
            const completed = items.filter(i => i.status === 'completed').length;
            const active = items.filter(i => i.status === 'active' && i.type === 'task').length;
            const ideas = items.filter(i => i.type === 'idea').length;

            document.getElementById('completionRate').innerText = `%${total ? Math.round((completed / total) * 100) : 0} Tamamlandı`;
            document.getElementById('activeTaskCount').innerText = `${active} Görev`;
            document.getElementById('ideaCount').innerText = `${ideas} Not`;
            document.getElementById('badgeCompletedCount').innerText = completed;
            document.getElementById('badgeAbandonedCount').innerText = items.filter(i => i.status === 'abandoned').length;
        }

        function renderTagCloud() {
            const container = document.getElementById('tagCloudContainer');
            const allTags = [...new Set(items.flatMap(i => i.tags))];
            container.innerHTML = allTags.length ? allTags.map(t => `<span class="bg-gray-100 dark:bg-inputBg border border-gray-200 dark:border-gray-800 px-2 py-0.5 rounded-md text-gray-400">#${t}</span>`).join('') : '<span class="text-gray-500 text-[10px]">Etiket yok</span>';
        }

        function setMood(emoji, save = true) {
            userProfile.mood = emoji;
            ['🔥', '⚡', '💡', '☕'].forEach(m => {
                const btn = document.getElementById(`mood-btn-${m}`);
                if (btn) btn.style.transform = m === emoji ? 'scale(1.3)' : 'scale(1)';
            });
            if (save) localStorage.setItem('nexus_user_profile', JSON.stringify(userProfile));
        }

        function changeStreamDate(days) {
            const d = new Date(activeDate);
            d.setDate(d.getDate() + days);
            activeDate = d.toISOString().split('T')[0];
            document.getElementById('streamDateInput').value = activeDate;
            updateDateLabel();
            render();
        }

        function changeCalendarMonth(offset) {
            const d = new Date(activeDate);
            d.setMonth(d.getMonth() + offset);
            activeDate = d.toISOString().split('T')[0];
            updateDateLabel();
            render();
        }

        function resetToToday() {
            activeDate = new Date().toISOString().split('T')[0];
            document.getElementById('streamDateInput').value = activeDate;
            updateDateLabel();
            render();
        }

        function updateDateLabel() {
            const today = new Date().toISOString().split('T')[0];
            const isToday = activeDate === today;
            document.getElementById('activeDateLabel').innerText = isToday ? 'Bugün' : activeDate;
            document.getElementById('todayResetBtn').classList.toggle('hidden', isToday);
        }

        function openCalendarDayModal(dateStr) {
            activeDate = dateStr;
            document.getElementById('streamDateInput').value = activeDate;
            updateDateLabel();

            const modalTitle = document.getElementById('calendarModalDateTitle');
            if (modalTitle) modalTitle.innerText = `${dateStr} Detayları`;
            
            refreshCalendarModalList();
            document.getElementById('calendarDayModal').classList.remove('hidden');
        }

        function addCalendarQuickItem() {
            const input = document.getElementById('calendarQuickInput');
            const text = input.value.trim();
            if (!text) return;

            const type = document.getElementById('calendarQuickType').value;
            const tags = (text.match(/#[\wĞÜŞİÖÇğüşiöç]+/g) || []).map(t => t.replace('#', ''));

            const newItem = {
                id: Date.now().toString(),
                content: text,
                type: type,
                status: 'active',
                date: activeDate,
                time: '09:00',
                tags: tags,
                createdAt: new Date().toISOString()
            };

            items.unshift(newItem);
            saveAndRender();
            input.value = '';
            refreshCalendarModalList();
        }

        function refreshCalendarModalList() {
            const dayItems = items.filter(i => i.date === activeDate);
            const modalList = document.getElementById('calendarModalItemsList');
            if (modalList) {
                modalList.innerHTML = dayItems.length === 0 
                    ? '<p class="text-xs text-gray-400 py-4 text-center">Bu güne ait herhangi bir kayıt yok.</p>'
                    : '';
                dayItems.forEach(item => {
                    modalList.appendChild(createItemCard(item));
                });
            }
        }

        function closeCalendarDayModal() {
            document.getElementById('calendarDayModal').classList.add('hidden');
        }

        function jumpToStreamDateFromModal() {
            closeCalendarDayModal();
            switchMainView('stream');
        }

        function togglePomodoroModal() {
            document.getElementById('pomodoroModal').classList.toggle('hidden');
        }

        function startPomodoro() {
            if (pomodoroRunning) {
                clearInterval(pomodoroInterval);
                pomodoroRunning = false;
                document.getElementById('pomoStartBtn').innerText = 'Başlat';
            } else {
                pomodoroRunning = true;
                document.getElementById('pomoStartBtn').innerText = 'Durdur';
                pomodoroInterval = setInterval(() => {
                    pomodoroTime--;
                    updatePomoDisplay();
                    if (pomodoroTime <= 0) {
                        clearInterval(pomodoroInterval);
                        alert('Pomodoro Süresi Doldu!');
                        resetPomodoro();
                    }
                }, 1000);
            }
        }

        function resetPomodoro() {
            clearInterval(pomodoroInterval);
            pomodoroRunning = false;
            pomodoroTime = parseInt(document.getElementById('pomoCustomMinutes').value) * 60;
            document.getElementById('pomoStartBtn').innerText = 'Başlat';
            updatePomoDisplay();
        }

        function updatePomoCustomTime(val) {
            pomodoroTime = parseInt(val) * 60;
            updatePomoDisplay();
        }

        function updatePomoDisplay() {
            const m = Math.floor(pomodoroTime / 60).toString().padStart(2, '0');
            const s = (pomodoroTime % 60).toString().padStart(2, '0');
            const str = `${m}:${s}`;
            document.getElementById('pomodoroDisplay').innerText = str;
            document.getElementById('modalTimerDisplay').innerText = str;
        }

        function openSettingsModal() {
            document.getElementById('settingsAppName').value = userProfile.name;
            document.getElementById('settingsAppBadge').value = userProfile.badge;
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettingsModal() {
            userProfile.name = document.getElementById('settingsAppName').value;
            userProfile.badge = document.getElementById('settingsAppBadge').value;
            localStorage.setItem('nexus_user_profile', JSON.stringify(userProfile));
            applyUserProfile();
            closeSettingsModal();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify({ items, userProfile }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `CoreOS_Backup_${activeDate}.json`;
            a.click();
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = JSON.parse(event.target.result);
                if (data.items) items = data.items;
                if (data.userProfile) userProfile = data.userProfile;
                saveAndRender();
                applyUserProfile();
                closeSettingsModal();
            };
            reader.readAsText(e.target.files[0]);
        }

        function resetData() {
            if (confirm('Tüm veriler sıfırlanacak. Emin misiniz?')) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
